name: Godot CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.3"
  EXPORT_NAME: "VectorChess"

jobs:
  test-and-validate:
    name: Headless Import & Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Project Resources Headlessly
        run: |
          godot --headless --import

      - name: Run Headless Unit Test Suite
        run: |
          godot --headless -s res://tests/test_rules.gd

  export-builds:
    name: Export Desktop, Mobile & Web Builds
    needs: test-and-validate
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Export Templates & Editor Settings
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable
          cp -r /root/.local/share/godot/export_templates/${GODOT_VERSION}.stable/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.stable/ || true
          mkdir -p ~/.config/godot
          cp -r /root/.config/godot/* ~/.config/godot/ || true
          cat <<EOF >> ~/.config/godot/editor_settings-${GODOT_VERSION}.tres
          export/android/java_sdk_path = "/usr/lib/jvm/java-17-openjdk-amd64"
          export/android/android_sdk_path = "/usr/lib/android-sdk"
          export/android/debug_keystore = "/root/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

      - name: Import Project
        run: |
          godot --headless --import

      - name: Export Windows Desktop
        run: |
          mkdir -p build/windows
          godot --headless --export-release "Windows Desktop" "build/windows/${EXPORT_NAME}.exe"
          test -f "build/windows/${EXPORT_NAME}.exe"
          test -f "build/windows/${EXPORT_NAME}.pck"

      - name: Export Linux Desktop
        run: |
          mkdir -p build/linux
          godot --headless --export-release "Linux" "build/linux/${EXPORT_NAME}.x86_64"
          chmod +x "build/linux/${EXPORT_NAME}.x86_64"
          test -f "build/linux/${EXPORT_NAME}.x86_64"
          test -f "build/linux/${EXPORT_NAME}.pck"

      - name: Export macOS (Universal App Bundle Zip)
        run: |
          mkdir -p build/macos
          godot --headless --export-release "macOS" "build/macos/${EXPORT_NAME}.zip"
          test -f "build/macos/${EXPORT_NAME}.zip"

      - name: Export Android (Debug APK Smoke Test)
        run: |
          mkdir -p build/android
          godot --headless --export-debug "Android (APK)" "build/android/${EXPORT_NAME}.apk"
          test -f "build/android/${EXPORT_NAME}.apk"

      - name: Export Web (HTML5 / WebAssembly)
        shell: bash
        run: |
          mkdir -p build/web
          godot --headless --export-release "Web" "build/web/index.html"
          CACHE_BUST=$(echo "${GITHUB_SHA}" | cut -c1-7)
          sed -i "s/index\\.js/index.js?v=${CACHE_BUST}/g; s/index\\.png/index.png?v=${CACHE_BUST}/g; s/index\\.icon\\.png/index.icon.png?v=${CACHE_BUST}/g; s/index\\.apple-touch-icon\\.png/index.apple-touch-icon.png?v=${CACHE_BUST}/g" "build/web/index.html"
          sed -i "s/fetch(file)/fetch(file + '?v=${CACHE_BUST}')/g; s/\\.audio\\.worklet\\.js/.audio.worklet.js?v=${CACHE_BUST}/g" "build/web/index.js"
          grep -q "index.js?v=${CACHE_BUST}" "build/web/index.html"
          grep -q "fetch(file + '?v=${CACHE_BUST}')" "build/web/index.js"
          test -f "build/web/index.html"

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vector-chess-builds
          path: build/
          if-no-files-found: error
