name: CI & Deploy Web

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

env:
  GODOT_VERSION: "4.3"
  RELEASE_TYPE: "stable"
  EXPORT_PRESET: "Web"
  BUILD_PATH: "build/web"

jobs:
  test-and-validate:
    name: Headless Import & Unit Tests
    runs-on: ubuntu-latest
    container:
      image: barichello/godot-ci:4.3
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Import Project Resources Headlessly
        run: |
          godot --headless --import

      - name: Run Headless Unit Test Suite
        run: |
          godot --headless -s res://tests/test_rules.gd

  build-web:
    name: Build Web Client (WASM)
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Godot Binary Cache
        id: godot-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/godot
          key: godot-${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}-linux-x86_64

      - name: Setup Export Templates Cache
        id: templates-cache
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}

      - name: Download & Install Godot Binary
        if: steps.godot-cache.outputs.cache-hit != 'true'
        env:
          GODOT_BASE_URL: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}"
          GODOT_ZIP: "Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_linux.x86_64.zip"
        run: |
          mkdir -p ~/.cache/godot
          curl -fsSL "${GODOT_BASE_URL}/${GODOT_ZIP}" -o "/tmp/${GODOT_ZIP}"
          unzip -q "/tmp/${GODOT_ZIP}" -d ~/.cache/godot
          mv ~/.cache/godot/Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_linux.x86_64 ~/.cache/godot/godot
          chmod +x ~/.cache/godot/godot
          rm -f "/tmp/${GODOT_ZIP}"

      - name: Download & Install Export Templates
        if: steps.templates-cache.outputs.cache-hit != 'true'
        env:
          GODOT_BASE_URL: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}"
          TEMPLATES_TPZ: "Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_export_templates.tpz"
        run: |
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE_TYPE}
          curl -fsSL "${GODOT_BASE_URL}/${TEMPLATES_TPZ}" -o "/tmp/${TEMPLATES_TPZ}"
          unzip -q "/tmp/${TEMPLATES_TPZ}" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE_TYPE}/
          rm -rf "/tmp/${TEMPLATES_TPZ}" /tmp/godot_templates

      - name: Add Godot to PATH
        run: |
          echo "$HOME/.cache/godot" >> "$GITHUB_PATH"
          $HOME/.cache/godot/godot --version

      - name: Import Project & Export Web Build
        shell: bash
        run: |
          mkdir -p "${BUILD_PATH}"
          godot --headless --import
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_PATH}/index.html"
          CACHE_BUST=$(echo "${GITHUB_SHA}" | cut -c1-7)
          sed -i "s/index\\.js/index.js?v=${CACHE_BUST}/g; s/index\\.png/index.png?v=${CACHE_BUST}/g; s/index\\.icon\\.png/index.icon.png?v=${CACHE_BUST}/g; s/index\\.apple-touch-icon\\.png/index.apple-touch-icon.png?v=${CACHE_BUST}/g" "${BUILD_PATH}/index.html"
          sed -i "s/fetch(file)/fetch(file + '?v=${CACHE_BUST}')/g; s/\\.audio\\.worklet\\.js/.audio.worklet.js?v=${CACHE_BUST}/g" "${BUILD_PATH}/index.js"
          grep -q "index.js?v=${CACHE_BUST}" "${BUILD_PATH}/index.html"
          grep -q "fetch(file + '?v=${CACHE_BUST}')" "${BUILD_PATH}/index.js"
          test -f "${BUILD_PATH}/index.html"
          test -f "${BUILD_PATH}/index.wasm"
          test -f "${BUILD_PATH}/index.pck"
          test -f "${BUILD_PATH}/index.js"

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

  deploy-web:
    name: Deploy Live Web Build to GitHub Pages
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
