name: CI & Deploy Web

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  GODOT_VERSION: "4.7.2"
  RELEASE_TYPE: "stable"
  EXPORT_PRESET: "Web"
  BUILD_PATH: "build/web"

jobs:
  test-and-validate:
    name: Headless Import & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install Godot Binary
        env:
          GODOT_BASE_URL: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}"
          GODOT_ZIP: "Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_linux.x86_64.zip"
        run: |
          GODOT_DIR="$HOME/.cache/godot/${GODOT_VERSION}-${RELEASE_TYPE}"
          if [ ! -x "${GODOT_DIR}/godot" ]; then
            mkdir -p "${GODOT_DIR}"
            curl -fsSL --retry 3 --retry-delay 2 "${GODOT_BASE_URL}/${GODOT_ZIP}" -o "$RUNNER_TEMP/${GODOT_ZIP}"
            unzip -q -o "$RUNNER_TEMP/${GODOT_ZIP}" -d "${GODOT_DIR}"
            mv -f "${GODOT_DIR}/Godot_v${GODOT_VERSION}-${RELEASE_TYPE}_linux.x86_64" "${GODOT_DIR}/godot"
            chmod +x "${GODOT_DIR}/godot"
            rm -f "$RUNNER_TEMP/${GODOT_ZIP}"
          fi
          echo "${GODOT_DIR}" >> "$GITHUB_PATH"
          "${GODOT_DIR}/godot" --version

      - name: Import Project Resources Headlessly
        run: |
          godot --headless --import

      - name: Run Headless Unit Test Suite
        run: |
          godot --headless -s res://tests/test_rules.gd

  build-web:
    name: Build Web Client (WASM)
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download & Install Godot Binary
        env:
          GODOT_BASE_URL: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}"
          GODOT_ZIP: "Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_linux.x86_64.zip"
        run: |
          GODOT_DIR="$HOME/.cache/godot/${GODOT_VERSION}-${RELEASE_TYPE}"
          if [ ! -x "${GODOT_DIR}/godot" ]; then
            mkdir -p "${GODOT_DIR}"
            curl -fsSL --retry 3 --retry-delay 2 "${GODOT_BASE_URL}/${GODOT_ZIP}" -o "$RUNNER_TEMP/${GODOT_ZIP}"
            unzip -q -o "$RUNNER_TEMP/${GODOT_ZIP}" -d "${GODOT_DIR}"
            mv -f "${GODOT_DIR}/Godot_v${GODOT_VERSION}-${RELEASE_TYPE}_linux.x86_64" "${GODOT_DIR}/godot"
            chmod +x "${GODOT_DIR}/godot"
            rm -f "$RUNNER_TEMP/${GODOT_ZIP}"
          fi
          echo "${GODOT_DIR}" >> "$GITHUB_PATH"
          "${GODOT_DIR}/godot" --version

      - name: Download & Install Web Export Templates
        env:
          GODOT_BASE_URL: "https://github.com/godotengine/godot/releases/download/${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}"
          TEMPLATES_TPZ: "Godot_v${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}_export_templates.tpz"
        run: |
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE_TYPE}"
          if [ ! -f "${TEMPLATE_DIR}/version.txt" ] || [ ! -f "${TEMPLATE_DIR}/web_nothreads_release.zip" ]; then
            mkdir -p "${TEMPLATE_DIR}"
            curl -fsSL --retry 3 --retry-delay 2 "${GODOT_BASE_URL}/${TEMPLATES_TPZ}" -o "$RUNNER_TEMP/${TEMPLATES_TPZ}"
            unzip -j -q -o "$RUNNER_TEMP/${TEMPLATES_TPZ}" 'templates/web_*.zip' 'templates/version.txt' -d "${TEMPLATE_DIR}"
            rm -f "$RUNNER_TEMP/${TEMPLATES_TPZ}"
          fi

      - name: Import Project & Export Web Build
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "${BUILD_PATH}"
          godot --headless --import
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_PATH}/index.html"
          CACHE_BUST="${COMMIT_SHA::7}"
          if [[ ! "${CACHE_BUST}" =~ ^[0-9a-fA-F]{7}$ ]]; then
            echo "::error::Invalid commit SHA '${COMMIT_SHA}'."
            exit 1
          fi
          python3 - "${BUILD_PATH}" "${CACHE_BUST}" <<'PY'
          import pathlib, sys

          build_dir = pathlib.Path(sys.argv[1])
          cache_bust = sys.argv[2]

          html_path = build_dir / "index.html"
          html = html_path.read_text(encoding="utf-8")
          for asset in ("index.js", "index.png", "index.icon.png", "index.apple-touch-icon.png"):
              html = html.replace(asset, f"{asset}?v={cache_bust}")
          html_path.write_text(html, encoding="utf-8")

          js_path = build_dir / "index.js"
          js = js_path.read_text(encoding="utf-8")
          js = js.replace("fetch(file)", f"fetch(file + '?v={cache_bust}')")
          js = js.replace(".audio.worklet.js", f".audio.worklet.js?v={cache_bust}")
          js_path.write_text(js, encoding="utf-8")
          PY
          grep -Fq "index.js?v=${CACHE_BUST}" "${BUILD_PATH}/index.html"
          grep -Fq "fetch(file + '?v=${CACHE_BUST}')" "${BUILD_PATH}/index.js"
          test -f "${BUILD_PATH}/index.html"
          test -f "${BUILD_PATH}/index.wasm"
          test -f "${BUILD_PATH}/index.pck"
          test -f "${BUILD_PATH}/index.js"

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

  deploy-web:
    name: Deploy Live Web Build to GitHub Pages
    needs: build-web
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
