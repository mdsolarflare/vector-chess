name: CI & Deploy Web

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

env:
  EXPORT_PRESET: "Web"
  BUILD_PATH: "build/web"

jobs:
  test-and-validate:
    name: Headless Import & Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Official Godot Binary
        uses: ./.github/actions/setup-godot

      - name: Import Project Resources Headlessly
        run: |
          godot --headless --import

      - name: Run Headless Unit Test Suite
        run: |
          godot --headless -s res://tests/test_rules.gd

  build-web:
    name: Build Web Client (WASM)
    needs: test-and-validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Official Godot Binary & Web Templates
        uses: ./.github/actions/setup-godot
        with:
          templates: web

      - name: Import Project & Export Web Build
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p "${BUILD_PATH}"
          godot --headless --import
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_PATH}/index.html"
          CACHE_BUST="${COMMIT_SHA::7}"
          if [[ ! "${CACHE_BUST}" =~ ^[0-9a-fA-F]{7}$ ]]; then
            echo "::error::Invalid commit SHA '${COMMIT_SHA}'."
            exit 1
          fi
          python3 - "${BUILD_PATH}" "${CACHE_BUST}" <<'PY'
          import pathlib, sys

          build_dir = pathlib.Path(sys.argv[1])
          cache_bust = sys.argv[2]

          html_path = build_dir / "index.html"
          html = html_path.read_text(encoding="utf-8")
          for asset in ("index.js", "index.png", "index.icon.png", "index.apple-touch-icon.png"):
              html = html.replace(asset, f"{asset}?v={cache_bust}")
          html_path.write_text(html, encoding="utf-8")

          js_path = build_dir / "index.js"
          js = js_path.read_text(encoding="utf-8")
          js = js.replace("fetch(file)", f"fetch(file + '?v={cache_bust}')")
          js = js.replace(".audio.worklet.js", f".audio.worklet.js?v={cache_bust}")
          js_path.write_text(js, encoding="utf-8")
          PY
          grep -Fq "index.js?v=${CACHE_BUST}" "${BUILD_PATH}/index.html"
          grep -Fq "fetch(file + '?v=${CACHE_BUST}')" "${BUILD_PATH}/index.js"
          test -f "${BUILD_PATH}/index.html"
          test -f "${BUILD_PATH}/index.wasm"
          test -f "${BUILD_PATH}/index.pck"
          test -f "${BUILD_PATH}/index.js"

      - name: Upload Pages Artifact
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.BUILD_PATH }}

  deploy-web:
    name: Deploy Live Web Build to GitHub Pages
    needs: build-web
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: "pages"
      cancel-in-progress: false
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
