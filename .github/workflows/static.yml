# Workflow for building Vector Chess (Godot 4 Web/WASM) and deploying to GitHub Pages
name: Deploy Godot Web Build to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3"
  RELEASE_TYPE: "stable"
  EXPORT_PRESET: "Web"
  BUILD_PATH: "build/web"

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Cache Godot binary and export templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/godot
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.RELEASE_TYPE }}
          key: godot-${{ runner.os }}-${{ env.GODOT_VERSION }}-${{ env.RELEASE_TYPE }}

      - name: Download and install Godot & Web export templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.cache/godot
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE_TYPE}

          GODOT_BASE_URL="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}-${RELEASE_TYPE}"
          EDITOR_ZIP="Godot_v${GODOT_VERSION}-${RELEASE_TYPE}_linux.x86_64.zip"
          TEMPLATES_TPZ="Godot_v${GODOT_VERSION}-${RELEASE_TYPE}_export_templates.tpz"

          echo "Downloading Godot ${GODOT_VERSION}-${RELEASE_TYPE} Linux binary..."
          curl -fsSL "${GODOT_BASE_URL}/${EDITOR_ZIP}" -o "/tmp/${EDITOR_ZIP}"
          unzip -q "/tmp/${EDITOR_ZIP}" -d ~/.cache/godot
          mv ~/.cache/godot/Godot_v${GODOT_VERSION}-${RELEASE_TYPE}_linux.x86_64 ~/.cache/godot/godot
          chmod +x ~/.cache/godot/godot
          rm -f "/tmp/${EDITOR_ZIP}"

          echo "Downloading Godot ${GODOT_VERSION}-${RELEASE_TYPE} export templates..."
          curl -fsSL "${GODOT_BASE_URL}/${TEMPLATES_TPZ}" -o "/tmp/${TEMPLATES_TPZ}"
          unzip -q "/tmp/${TEMPLATES_TPZ}" -d /tmp/godot_templates
          mv /tmp/godot_templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${RELEASE_TYPE}/
          rm -rf "/tmp/${TEMPLATES_TPZ}" /tmp/godot_templates

      - name: Add Godot to PATH
        run: |
          echo "$HOME/.cache/godot" >> $GITHUB_PATH
          $HOME/.cache/godot/godot --version

      - name: Import project and export Web (WASM) build
        run: |
          mkdir -p "${BUILD_PATH}"
          # Bootstrap .godot/ import cache and global_script_class_cache.cfg
          godot --headless --import
          # Export release Web build (index.html, index.wasm, index.pck, index.js)
          godot --headless --export-release "${EXPORT_PRESET}" "${BUILD_PATH}/index.html"
          ls -lh "${BUILD_PATH}"
          test -f "${BUILD_PATH}/index.html"
          test -f "${BUILD_PATH}/index.wasm"
          test -f "${BUILD_PATH}/index.pck"
          test -f "${BUILD_PATH}/index.js"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ env.BUILD_PATH }}

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
