name: Store Release Pipeline

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release version (e.g. 0.2.0 — without leading 'v')"
        required: true
        type: string
        default: "0.1.0"
      steam_branch:
        description: "Non-default Steam branch to set live via SteamCMD (e.g. beta, or leave empty for none; 'default' must be promoted in Steamworks UI)"
        required: false
        type: string
        default: "beta"
      upload_to_stores:
        description: "Upload directly to Steam / Google Play / App Store Connect (if secrets exist)"
        required: false
        type: boolean
        default: true
      create_github_release:
        description: "Create git tag v<release_version> and publish GitHub Release"
        required: false
        type: boolean
        default: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  EXPORT_NAME: "VectorChess"

jobs:
  # ---------------------------------------------------------------------------
  # 1. Gate release on centralized input validation, headless import & tests
  # ---------------------------------------------------------------------------
  test:
    name: Validate & Run Unit Tests
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      short_version: ${{ steps.meta.outputs.short_version }}
      tag_name: ${{ steps.meta.outputs.tag_name }}
      steam_branch: ${{ steps.meta.outputs.steam_branch }}
    steps:
      - name: Validate Release Inputs
        id: meta
        env:
          RAW_VERSION: ${{ inputs.release_version }}
          SET_LIVE: ${{ inputs.steam_branch }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          VER="${RAW_VERSION#v}"
          if [[ ! "${VER}" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            echo "::error::Invalid release_version '${RAW_VERSION}'. Expected strict semver (e.g. 0.2.0 or 0.2.0-rc.1, without leading zeros)."
            exit 1
          fi
          TRIMMED_LIVE="${SET_LIVE#"${SET_LIVE%%[![:space:]]*}"}"
          TRIMMED_LIVE="${TRIMMED_LIVE%"${TRIMMED_LIVE##*[![:space:]]}"}"
          if [[ "${TRIMMED_LIVE,,}" == "default" ]]; then
            echo "::error::SteamPipe/SteamCMD forbids setting the 'default' branch live via SetLive. Leave steam_branch empty (or upload to 'beta') and promote to 'default' in the Steamworks Partner web portal."
            exit 1
          fi
          if [[ ! "${SET_LIVE}" =~ ^[0-9A-Za-z._/-]*$ ]]; then
            echo "::error::Invalid steam_branch '${SET_LIVE}'. Only alphanumeric characters and . _ / - are allowed."
            exit 1
          fi
          if [[ ! "${RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::Invalid GitHub run_number '${RUN_NUMBER}'."
            exit 1
          fi
          if [[ ! "${RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || (( RUN_ATTEMPT < 1 || RUN_ATTEMPT > 99 )); then
            echo "::error::Invalid GitHub run_attempt '${RUN_ATTEMPT}' (must be 1..99)."
            exit 1
          fi
          SHORT_VER="${VER%%-*}"
          IFS='.' read -r VER_MAJOR VER_MINOR VER_PATCH <<< "${SHORT_VER}"
          for PART in "${VER_MAJOR}" "${VER_MINOR}" "${VER_PATCH}"; do
            if (( 10#${PART} > 65535 )); then
              echo "::error::Version component '${PART}' in '${SHORT_VER}' exceeds Windows PE 16-bit limit (65535)."
              exit 1
            fi
          done
          BUILD_VERSION=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          if (( BUILD_VERSION > 2100000000 )); then
            echo "::error::Computed build_version '${BUILD_VERSION}' exceeds Google Play maximum versionCode (2100000000)."
            exit 1
          fi
          {
            echo "version=${VER}"
            echo "short_version=${SHORT_VER}"
            echo "tag_name=v${VER}"
            echo "steam_branch=${SET_LIVE}"
          } >> "$GITHUB_OUTPUT"

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Official Godot Binary
        uses: ./.github/actions/setup-godot

      - name: Import & Run Tests
        run: |
          godot --headless --import
          godot --headless -s res://tests/test_rules.gd

  # ---------------------------------------------------------------------------
  # 2. Build Windows (Steam), Linux/Deck (Steam), and Android (.aab & .apk)
  # ---------------------------------------------------------------------------
  build-desktop-android:
    name: Build Windows, Linux & Android (.aab)
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stamp Release Version
        id: stamp
        env:
          VERSION: ${{ needs.test.outputs.version }}
          SHORT_VERSION: ${{ needs.test.outputs.short_version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ ! "${RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]] || [[ ! "${RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || (( RUN_ATTEMPT < 1 || RUN_ATTEMPT > 99 )); then
            echo "::error::Invalid GitHub run_number/run_attempt ('${RUN_NUMBER}' / '${RUN_ATTEMPT}')."
            exit 1
          fi
          BUILD_VERSION=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          if (( BUILD_VERSION > 2100000000 )); then
            echo "::error::Computed build_version '${BUILD_VERSION}' exceeds Google Play maximum versionCode (2100000000)."
            exit 1
          fi
          WIN_BUILD=$(( (BUILD_VERSION - 1) % 65535 + 1 ))
          WIN_VERSION="${SHORT_VERSION}.${WIN_BUILD}"

          python3 - "${VERSION}" "${BUILD_VERSION}" "${WIN_VERSION}" <<'PY'
          import pathlib, re, sys

          ver, build_ver, win_ver = sys.argv[1:4]
          proj_path = pathlib.Path("project.godot")
          proj_text = proj_path.read_text(encoding="utf-8")
          proj_text, n_proj = re.subn(
              r'^config/version=".*"$',
              lambda _: f'config/version="{ver}"',
              proj_text,
              flags=re.MULTILINE,
          )
          if n_proj != 1:
              raise SystemExit(f"Expected 1 config/version in project.godot, updated {n_proj}")
          proj_path.write_text(proj_text, encoding="utf-8")

          presets_path = pathlib.Path("export_presets.cfg")
          presets_text = presets_path.read_text(encoding="utf-8")
          presets_text, n_code = re.subn(
              r'^(version/code)=[0-9]+$',
              lambda m: f'{m.group(1)}={build_ver}',
              presets_text,
              flags=re.MULTILINE,
          )
          presets_text, n_name = re.subn(
              r'^(version/name)=".*"$',
              lambda m: f'{m.group(1)}="{ver}"',
              presets_text,
              flags=re.MULTILINE,
          )
          presets_text, n_win_file = re.subn(
              r'^(application/file_version)=".*"$',
              lambda m: f'{m.group(1)}="{win_ver}"',
              presets_text,
              flags=re.MULTILINE,
          )
          presets_text, n_win_prod = re.subn(
              r'^(application/product_version)=".*"$',
              lambda m: f'{m.group(1)}="{win_ver}"',
              presets_text,
              flags=re.MULTILINE,
          )
          if n_code != 2 or n_name != 2:
              raise SystemExit(
                  f"Expected 2 Android version/code and version/name entries in export_presets.cfg (got {n_code}, {n_name})"
              )
          if n_win_file != 1 or n_win_prod != 1:
              raise SystemExit(
                  f"Expected 1 Windows file_version and product_version entry in export_presets.cfg (got {n_win_file}, {n_win_prod})"
              )
          presets_path.write_text(presets_text, encoding="utf-8")
          PY
          {
            echo "build_version=${BUILD_VERSION}"
            echo "win_version=${WIN_VERSION}"
          } >> "$GITHUB_OUTPUT"

      - name: Setup Java 17 (Required for Godot 4.7 Android Gradle Builds)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Official Godot Binary & Export Templates
        id: setup-godot
        uses: ./.github/actions/setup-godot
        with:
          templates: desktop-android

      - name: Import Project Headlessly
        run: |
          godot --headless --import

      - name: Export Windows & Linux Depots
        env:
          VERSION: ${{ needs.test.outputs.version }}
          WIN_VERSION: ${{ steps.stamp.outputs.win_version }}
          TEMPLATES_DIR: ${{ steps.setup-godot.outputs.templates-dir }}
        run: |
          set -o pipefail
          mkdir -p build/windows build/linux dist
          WIN_EXPORT_LOG="$RUNNER_TEMP/windows-export.log"
          godot --headless --export-release "Windows Desktop" "build/windows/${EXPORT_NAME}.exe" 2>&1 | tee "${WIN_EXPORT_LOG}"
          if grep -Eiq "Resources Modification|Invalid icon|Invalid file version|Invalid product version|template_modifier|Could not load icon|Cannot load icon|rcedit" "${WIN_EXPORT_LOG}"; then
            echo "::error::Windows export reported PE resource or icon modification warnings."
            exit 1
          fi
          rm -f "${WIN_EXPORT_LOG}"

          python3 .github/scripts/verify_windows_pe.py \
            --template "${TEMPLATES_DIR}/windows_release_x86_64.exe" \
            --expect "ProductName=Vector Chess" \
            --expect "FileDescription=Vector Chess - Polygon Pandemonium" \
            --expect "CompanyName=Vector Chess" \
            --expect "FileVersion=${WIN_VERSION}" \
            --expect "ProductVersion=${WIN_VERSION}" \
            --forbid-substring "ProductName=Godot" \
            --forbid-substring "FileDescription=Godot" \
            "build/windows/${EXPORT_NAME}.exe"

          godot --headless --export-release "Linux" "build/linux/${EXPORT_NAME}.x86_64"
          chmod +x "build/linux/${EXPORT_NAME}.x86_64"
          test -f "build/windows/${EXPORT_NAME}.exe"
          test -f "build/windows/${EXPORT_NAME}.pck"
          test -f "build/linux/${EXPORT_NAME}.x86_64"
          test -f "build/linux/${EXPORT_NAME}.pck"

          # Create standalone release archives + tar Linux depot to preserve +x permissions
          (cd build/windows && zip -qr "../../dist/${EXPORT_NAME}-Windows-v${VERSION}.zip" .)
          (cd build/linux && tar -czf "../../dist/${EXPORT_NAME}-Linux-v${VERSION}.tar.gz" .)
          tar -cf build/steam-linux.tar -C build linux

      - name: Configure Android SDK, Gradle Template & Keystore
        id: android-config
        env:
          TEMPLATES_DIR: ${{ steps.setup-godot.outputs.templates-dir }}
          GODOT_VERSION: ${{ steps.setup-godot.outputs.version }}
          RELEASE_TYPE: ${{ steps.setup-godot.outputs.release-type }}
          GODOT_MINOR: ${{ steps.setup-godot.outputs.minor-version }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          # Populate Godot Android Gradle template from export templates
          mkdir -p android/build
          unzip -q -o "${TEMPLATES_DIR}/android_source.zip" -d android/build/
          touch android/build/.gdignore
          chmod +x android/build/gradlew
          printf "%s.%s" "${GODOT_VERSION}" "${RELEASE_TYPE}" > android/.build_version

          # Accept Android SDK licenses on runner
          yes | "${ANDROID_HOME}/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

          # Setup debug keystore for EditorSettings validation
          (
            umask 077
            keytool -genkeypair -v -keystore "$RUNNER_TEMP/debug.keystore" \
              -storepass android -alias androiddebugkey -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          )

          mkdir -p ~/.config/godot
          cat <<EOF > ~/.config/godot/editor_settings-${GODOT_MINOR}.tres
          [gd_resource type="EditorSettings" format=3]
          [resource]
          export/android/java_sdk_path = "${JAVA_HOME}"
          export/android/android_sdk_path = "${ANDROID_HOME}"
          export/android/debug_keystore = "${RUNNER_TEMP}/debug.keystore"
          export/android/debug_keystore_user = "androiddebugkey"
          export/android/debug_keystore_pass = "android"
          EOF

          # Decode production upload keystore or generate ephemeral keystore for dry-run builds
          if [ -n "${ANDROID_KEYSTORE_BASE64}" ]; then
            if [ -z "${ANDROID_KEYSTORE_USER}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD}" ]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 is set, but ANDROID_KEYSTORE_USER or ANDROID_KEYSTORE_PASSWORD is empty."
              exit 1
            fi
            (
              umask 077
              printf '%s\n' "${ANDROID_KEYSTORE_BASE64}" | base64 --decode > "$RUNNER_TEMP/release.keystore"
            )
            EOF_DELIM="EOF_$(cat /proc/sys/kernel/random/uuid)"
            {
              printf 'GODOT_ANDROID_KEYSTORE_RELEASE_PATH=%s\n' "$RUNNER_TEMP/release.keystore"
              printf 'GODOT_ANDROID_KEYSTORE_RELEASE_USER<<%s\n%s\n%s\n' "${EOF_DELIM}" "${ANDROID_KEYSTORE_USER}" "${EOF_DELIM}"
              printf 'GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD<<%s\n%s\n%s\n' "${EOF_DELIM}" "${ANDROID_KEYSTORE_PASSWORD}" "${EOF_DELIM}"
            } >> "$GITHUB_ENV"
            echo '- Android `.aab`: Signed with **Production Upload Keystore**.' >> "$GITHUB_STEP_SUMMARY"
            if [ -n "${GOOGLE_PLAY_SERVICE_ACCOUNT_JSON}" ]; then
              echo "can_upload_play=true" >> "$GITHUB_OUTPUT"
            else
              echo "can_upload_play=false" >> "$GITHUB_OUTPUT"
            fi
          else
            (
              umask 077
              keytool -genkeypair -v -keystore "$RUNNER_TEMP/ephemeral.keystore" \
                -storepass vectorchess -alias vectorchess -keypass vectorchess \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -dname "CN=Vector Chess Dry Run,O=VectorChess,C=US"
            )
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$RUNNER_TEMP/ephemeral.keystore" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=vectorchess" >> "$GITHUB_ENV"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=vectorchess" >> "$GITHUB_ENV"
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; signing .aab with an ephemeral test keystore."
            echo '- Android `.aab`: Signed with **Ephemeral Test Keystore** (configure `ANDROID_KEYSTORE_BASE64` before Play Store upload).' >> "$GITHUB_STEP_SUMMARY"
            echo "can_upload_play=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Export Android Play Store (.aab) & Sideload (.apk)
        env:
          VERSION: ${{ needs.test.outputs.version }}
        run: |
          mkdir -p build/android dist
          godot --headless --export-release "Android (Play Store)" "dist/${EXPORT_NAME}-v${VERSION}.aab"
          godot --headless --export-release "Android (APK)" "dist/${EXPORT_NAME}-v${VERSION}.apk"
          test -f "dist/${EXPORT_NAME}-v${VERSION}.aab"
          test -f "dist/${EXPORT_NAME}-v${VERSION}.apk"

      - name: Cleanup Android Signing Keystores
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release.keystore" "$RUNNER_TEMP/ephemeral.keystore" "$RUNNER_TEMP/debug.keystore"
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH="
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER="
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD="
          } >> "$GITHUB_ENV"

      - name: Upload to Google Play (Internal Track)
        if: inputs.upload_to_stores == true && steps.android-config.outputs.can_upload_play == 'true'
        env:
          VERSION: ${{ needs.test.outputs.version }}
          GOOGLE_PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          AAB_PATH="dist/${EXPORT_NAME}-v${VERSION}.aab"
          python3 - "com.vectorchess.game" "${AAB_PATH}" <<'PY'
          import base64, json, os, pathlib, subprocess, sys, tempfile, time, urllib.error, urllib.parse, urllib.request

          package_name, aab_file = sys.argv[1], sys.argv[2]
          sa = json.loads(os.environ["GOOGLE_PLAY_SERVICE_ACCOUNT_JSON"])
          token_uri = sa.get("token_uri") or "https://oauth2.googleapis.com/token"
          api_root = os.environ.get("GOOGLE_PLAY_API_ROOT") or "https://androidpublisher.googleapis.com"

          def b64u(raw: bytes) -> str:
              return base64.urlsafe_b64encode(raw).rstrip(b"=").decode("ascii")

          now = int(time.time())
          header = b64u(json.dumps({"alg": "RS256", "typ": "JWT"}, separators=(",", ":")).encode("utf-8"))
          claims = b64u(json.dumps({
              "iss": sa["client_email"],
              "scope": "https://www.googleapis.com/auth/androidpublisher",
              "aud": token_uri,
              "iat": now,
              "exp": now + 3600,
          }, separators=(",", ":")).encode("utf-8"))
          signing_input = f"{header}.{claims}"

          fd, key_path = tempfile.mkstemp(dir=os.environ.get("RUNNER_TEMP") or None, suffix=".pem")
          try:
              with os.fdopen(fd, "w", encoding="utf-8") as kf:
                  kf.write(sa["private_key"])
              sig = subprocess.run(
                  ["openssl", "dgst", "-sha256", "-sign", key_path],
                  input=signing_input.encode("ascii"),
                  capture_output=True,
                  check=True,
              ).stdout
          finally:
              try:
                  os.remove(key_path)
              except OSError:
                  pass

          assertion = f"{signing_input}.{b64u(sig)}"
          token_body = urllib.parse.urlencode({
              "grant_type": "urn:ietf:params:oauth:grant-type:jwt-bearer",
              "assertion": assertion,
          }).encode("utf-8")
          token_req = urllib.request.Request(
              token_uri,
              data=token_body,
              headers={"Content-Type": "application/x-www-form-urlencoded"},
              method="POST",
          )
          try:
              with urllib.request.urlopen(token_req, timeout=60) as resp:
                  access_token = json.loads(resp.read().decode("utf-8"))["access_token"]
          except urllib.error.HTTPError as exc:
              detail = exc.read().decode("utf-8", errors="replace")
              raise SystemExit(f"Google OAuth2 token exchange failed ({exc.code}): {detail}") from None

          def api_request(url: str, method: str, data: bytes = b"", content_type: str | None = "application/json") -> dict:
              headers = {"Authorization": f"Bearer {access_token}"}
              if content_type is not None:
                  headers["Content-Type"] = content_type
              if not data:
                  headers["Content-Length"] = "0"
              req = urllib.request.Request(
                  url,
                  data=data if data else None,
                  headers=headers,
                  method=method,
              )
              try:
                  with urllib.request.urlopen(req, timeout=300) as r:
                      raw = r.read().decode("utf-8")
                      return json.loads(raw) if raw else {}
              except urllib.error.HTTPError as exc:
                  detail = exc.read().decode("utf-8", errors="replace")
                  raise SystemExit(f"Google Play API {method} {url} failed ({exc.code}): {detail}") from None

          edits_base = f"{api_root}/androidpublisher/v3/applications/{package_name}/edits"
          edit_id = api_request(edits_base, "POST", b"{}")["id"]
          upload_url = f"{api_root}/upload/androidpublisher/v3/applications/{package_name}/edits/{edit_id}/bundles?uploadType=media"
          bundle = api_request(upload_url, "POST", pathlib.Path(aab_file).read_bytes(), "application/octet-stream")
          version_code = bundle["versionCode"]
          track_payload = json.dumps({
              "track": "internal",
              "releases": [{"versionCodes": [str(version_code)], "status": "draft"}],
          }).encode("utf-8")
          api_request(f"{edits_base}/{edit_id}/tracks/internal", "PUT", track_payload)
          api_request(f"{edits_base}/{edit_id}:commit", "POST", b"", None)
          print(f"Uploaded {aab_file} (versionCode={version_code}) to Google Play internal track (draft).")
          PY
          echo '- Android `.aab`: Uploaded to **Google Play Internal Track** (`draft`).' >> "$GITHUB_STEP_SUMMARY"

      - name: Upload Steam Windows Depot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-windows
          path: build/windows/
          if-no-files-found: error

      - name: Upload Steam Linux Depot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-linux
          path: build/steam-linux.tar
          if-no-files-found: error

      - name: Upload Desktop & Android Release Packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-desktop-android
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 3. Build macOS (Steam Universal .app) & iOS (.ipa) on Mac Mini or GitHub macOS
  #    Set repo variable USE_SELF_HOSTED_MAC=true once your ARM Mac Mini runner is active.
  # ---------------------------------------------------------------------------
  build-apple:
    name: Build macOS (.app) & iOS (.ipa)
    needs: test
    runs-on: ${{ vars.USE_SELF_HOSTED_MAC == 'true' && fromJSON('["self-hosted", "macOS", "ARM64"]') || 'macos-latest' }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Stamp Release Version
        id: stamp
        env:
          VERSION: ${{ needs.test.outputs.version }}
          SHORT_VERSION: ${{ needs.test.outputs.short_version }}
          RUN_NUMBER: ${{ github.run_number }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          if [[ ! "${RUN_NUMBER}" =~ ^[1-9][0-9]*$ ]] || [[ ! "${RUN_ATTEMPT}" =~ ^[1-9][0-9]*$ ]] || (( RUN_ATTEMPT < 1 || RUN_ATTEMPT > 99 )); then
            echo "::error::Invalid GitHub run_number/run_attempt ('${RUN_NUMBER}' / '${RUN_ATTEMPT}')."
            exit 1
          fi
          BUILD_VERSION=$(( RUN_NUMBER * 100 + RUN_ATTEMPT ))
          if (( BUILD_VERSION > 2100000000 )); then
            echo "::error::Computed build_version '${BUILD_VERSION}' exceeds supported build number limit (2100000000)."
            exit 1
          fi

          python3 - "${VERSION}" "${SHORT_VERSION}" "${BUILD_VERSION}" <<'PY'
          import pathlib, re, sys

          ver, short_ver, build_ver = sys.argv[1:4]

          proj_path = pathlib.Path("project.godot")
          proj_text = proj_path.read_text(encoding="utf-8")
          proj_text, n_proj = re.subn(
              r'^config/version=".*"$',
              lambda _: f'config/version="{ver}"',
              proj_text,
              flags=re.MULTILINE,
          )
          if n_proj != 1:
              raise SystemExit(f"Expected 1 config/version in project.godot, updated {n_proj}")
          proj_path.write_text(proj_text, encoding="utf-8")

          presets_path = pathlib.Path("export_presets.cfg")
          presets_text = presets_path.read_text(encoding="utf-8")
          presets_text, n_short = re.subn(
              r'^(application/short_version)=".*"$',
              lambda m: f'{m.group(1)}="{short_ver}"',
              presets_text,
              flags=re.MULTILINE,
          )
          presets_text, n_ver = re.subn(
              r'^(application/version)=".*"$',
              lambda m: f'{m.group(1)}="{build_ver}"',
              presets_text,
              flags=re.MULTILINE,
          )
          if n_short != 2 or n_ver != 2:
              raise SystemExit(
                  f"Expected 2 macOS/iOS short_version and version entries in export_presets.cfg (got {n_short}, {n_ver})"
              )
          presets_path.write_text(presets_text, encoding="utf-8")
          PY
          echo "build_version=${BUILD_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Official Godot macOS Binary & Export Templates
        id: setup-godot
        uses: ./.github/actions/setup-godot
        with:
          templates: apple

      - name: Import Project Headlessly
        env:
          GODOT_BIN: ${{ steps.setup-godot.outputs.godot-bin }}
        run: |
          "${GODOT_BIN}" --headless --import

      - name: Export, Sign & Notarize macOS Universal App (Steam)
        env:
          GODOT_BIN: ${{ steps.setup-godot.outputs.godot-bin }}
          VERSION: ${{ needs.test.outputs.version }}
          APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_MACOS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_MACOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_MACOS_SIGNING_IDENTITY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
        run: |
          mkdir -p build/macos dist
          "${GODOT_BIN}" --headless --export-release "macOS" "build/macos/${EXPORT_NAME}.app"
          test -d "build/macos/${EXPORT_NAME}.app"

          if [ -n "${APPLE_CERTIFICATE_BASE64}" ]; then
            KEYCHAIN_PATH="$RUNNER_TEMP/build-macos.keychain-db"
            KEYCHAIN_PASS=$(uuidgen)
            NOTARIZE_ZIP="$RUNNER_TEMP/${EXPORT_NAME}-notarize.zip"
            trap 'rm -rf "$RUNNER_TEMP/macos_cert.p12" "$RUNNER_TEMP/private_keys" "${NOTARIZE_ZIP}"; security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true' EXIT
            (
              umask 077
              printf '%s\n' "${APPLE_CERTIFICATE_BASE64}" | base64 --decode > "$RUNNER_TEMP/macos_cert.p12"
            )

            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security import "$RUNNER_TEMP/macos_cert.p12" -P "${APPLE_CERTIFICATE_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
            EXISTING_KEYCHAINS=()
            while IFS= read -r kc; do
              kc="${kc#"${kc%%[![:space:]]*}"}"
              kc="${kc%"${kc##*[![:space:]]}"}"
              kc="${kc#\"}"
              kc="${kc%\"}"
              if [ -n "${kc}" ]; then
                EXISTING_KEYCHAINS+=("${kc}")
              fi
            done <<EOF
          $(security list-keychains -d user)
          EOF
            security list-keychain -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS[@]+"${EXISTING_KEYCHAINS[@]}"}
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

            IDENTITY="${APPLE_SIGNING_IDENTITY:-Developer ID Application}"
            codesign --force --deep --options runtime --timestamp --keychain "${KEYCHAIN_PATH}" --sign "${IDENTITY}" "build/macos/${EXPORT_NAME}.app"

            if [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER_ID}" ] && [ -n "${APPLE_API_PRIVATE_KEY}" ]; then
              if [[ ! "${APPLE_API_KEY_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
                echo "::error::Invalid APPLE_API_KEY_ID format."
                exit 1
              fi
              KEY_FILE="$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
              (
                umask 077
                mkdir -p "$RUNNER_TEMP/private_keys"
                printf "%s\n" "${APPLE_API_PRIVATE_KEY}" > "${KEY_FILE}"
              )
              ditto -c -k --keepParent "build/macos/${EXPORT_NAME}.app" "${NOTARIZE_ZIP}"
              xcrun notarytool submit "${NOTARIZE_ZIP}" \
                --key "${KEY_FILE}" \
                --key-id "${APPLE_API_KEY_ID}" \
                --issuer "${APPLE_API_ISSUER_ID}" \
                --wait
              rm -f "${KEY_FILE}" "${NOTARIZE_ZIP}"
              xcrun stapler staple "build/macos/${EXPORT_NAME}.app"
              echo '- macOS `.app`: Signed with **Developer ID** and **Notarized**.' >> "$GITHUB_STEP_SUMMARY"
            else
              echo '- macOS `.app`: Signed with **Developer ID** (notarization skipped; API key secrets not set).' >> "$GITHUB_STEP_SUMMARY"
            fi
            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          else
            codesign --force --deep -s - "build/macos/${EXPORT_NAME}.app"
            echo "::warning::Apple Developer ID certificate not set; macOS .app is ad-hoc signed."
            echo '- macOS `.app`: **Ad-hoc signed** (configure `APPLE_MACOS_CERTIFICATE_BASE64` before public Steam macOS launch).' >> "$GITHUB_STEP_SUMMARY"
          fi

          # Preserve bundle symlinks & permissions for GitHub Release and Steam depot
          ditto -c -k --keepParent "build/macos/${EXPORT_NAME}.app" "dist/${EXPORT_NAME}-macOS-v${VERSION}.zip"
          COPYFILE_DISABLE=1 tar -cf build/steam-macos.tar -C build macos

      - name: Export iOS (.ipa or Xcode Project)
        env:
          GODOT_BIN: ${{ steps.setup-godot.outputs.godot-bin }}
          VERSION: ${{ needs.test.outputs.version }}
          SHORT_VERSION: ${{ needs.test.outputs.short_version }}
          BUILD_VERSION: ${{ steps.stamp.outputs.build_version }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_ID: ${{ secrets.APPLE_APP_ID || vars.APPLE_APP_ID }}
          APPLE_IOS_CERT_BASE64: ${{ secrets.APPLE_IOS_CERTIFICATE_BASE64 || secrets.APPLE_CERTIFICATE_BASE64 }}
          APPLE_IOS_CERT_PASSWORD: ${{ secrets.APPLE_IOS_CERTIFICATE_PASSWORD || secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_PROVISION_BASE64: ${{ secrets.APPLE_IOS_PROVISIONING_PROFILE_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          APPLE_API_PRIVATE_KEY: ${{ secrets.APPLE_API_PRIVATE_KEY }}
          UPLOAD_TO_STORES: ${{ inputs.upload_to_stores == true }}
        run: |
          mkdir -p build/ios dist

          if [ -n "${APPLE_TEAM_ID}" ] && [ -n "${APPLE_IOS_CERT_BASE64}" ] && [ -n "${APPLE_PROVISION_BASE64}" ]; then
            if [[ ! "${APPLE_TEAM_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
              echo "::error::Invalid APPLE_TEAM_ID format."
              exit 1
            fi
            KEYCHAIN_PATH="$RUNNER_TEMP/build-ios.keychain-db"
            KEYCHAIN_PASS=$(uuidgen)
            INSTALLED_PROFILE_LEGACY=""
            INSTALLED_PROFILE_XCODE16=""
            trap 'rm -rf "$RUNNER_TEMP/ios_cert.p12" "$RUNNER_TEMP/profile.mobileprovision" "$RUNNER_TEMP/profile.plist" "$RUNNER_TEMP/private_keys" "$RUNNER_TEMP/altool-list-apps.err" ${INSTALLED_PROFILE_LEGACY:+"${INSTALLED_PROFILE_LEGACY}"} ${INSTALLED_PROFILE_XCODE16:+"${INSTALLED_PROFILE_XCODE16}"}; security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true' EXIT
            (
              umask 077
              printf '%s\n' "${APPLE_IOS_CERT_BASE64}" | base64 --decode > "$RUNNER_TEMP/ios_cert.p12"
              printf '%s\n' "${APPLE_PROVISION_BASE64}" | base64 --decode > "$RUNNER_TEMP/profile.mobileprovision"
            )

            security create-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security set-keychain-settings -lut 21600 "${KEYCHAIN_PATH}"
            security unlock-keychain -p "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"
            security import "$RUNNER_TEMP/ios_cert.p12" -P "${APPLE_IOS_CERT_PASSWORD}" -A -t cert -f pkcs12 -k "${KEYCHAIN_PATH}"
            EXISTING_KEYCHAINS=()
            while IFS= read -r kc; do
              kc="${kc#"${kc%%[![:space:]]*}"}"
              kc="${kc%"${kc##*[![:space:]]}"}"
              kc="${kc#\"}"
              kc="${kc%\"}"
              if [ -n "${kc}" ]; then
                EXISTING_KEYCHAINS+=("${kc}")
              fi
            done <<EOF
          $(security list-keychains -d user)
          EOF
            security list-keychain -d user -s "${KEYCHAIN_PATH}" ${EXISTING_KEYCHAINS[@]+"${EXISTING_KEYCHAINS[@]}"}
            security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "${KEYCHAIN_PASS}" "${KEYCHAIN_PATH}"

            (
              umask 077
              security cms -D -i "$RUNNER_TEMP/profile.mobileprovision" > "$RUNNER_TEMP/profile.plist"
            )
            PROFILE_UUID=$(/usr/libexec/PlistBuddy -c "Print UUID" "$RUNNER_TEMP/profile.plist")
            if [[ ! "${PROFILE_UUID}" =~ ^[0-9A-Fa-f-]+$ ]]; then
              echo "::error::Invalid provisioning profile UUID."
              exit 1
            fi
            mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
            INSTALLED_PROFILE_LEGACY="$HOME/Library/MobileDevice/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            INSTALLED_PROFILE_XCODE16="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/${PROFILE_UUID}.mobileprovision"
            (
              umask 077
              cp "$RUNNER_TEMP/profile.mobileprovision" "${INSTALLED_PROFILE_LEGACY}"
              cp "$RUNNER_TEMP/profile.mobileprovision" "${INSTALLED_PROFILE_XCODE16}"
            )

            python3 -c '
          import pathlib, sys
          p = pathlib.Path("export_presets.cfg")
          s = p.read_text(encoding="utf-8")
          t = "application/app_store_team_id=\"\""
          if t not in s:
              raise SystemExit("Failed to find empty application/app_store_team_id in export_presets.cfg")
          p.write_text(s.replace(t, f"application/app_store_team_id=\"{sys.argv[1]}\""), encoding="utf-8")
          ' "${APPLE_TEAM_ID}"
            export GODOT_IOS_PROVISIONING_PROFILE_UUID_RELEASE="${PROFILE_UUID}"

            IPA_PATH="dist/${EXPORT_NAME}-v${VERSION}.ipa"
            "${GODOT_BIN}" --headless --export-release "iOS" "${IPA_PATH}"
            test -f "${IPA_PATH}"
            echo '- iOS `.ipa`: Signed for **App Store / TestFlight**.' >> "$GITHUB_STEP_SUMMARY"

            if [ "${UPLOAD_TO_STORES}" = "true" ] && [ -n "${APPLE_API_KEY_ID}" ] && [ -n "${APPLE_API_ISSUER_ID}" ] && [ -n "${APPLE_API_PRIVATE_KEY}" ]; then
              if [[ ! "${APPLE_API_KEY_ID}" =~ ^[A-Za-z0-9]+$ ]]; then
                echo "::error::Invalid APPLE_API_KEY_ID format."
                exit 1
              fi
              (
                umask 077
                mkdir -p "$RUNNER_TEMP/private_keys"
                printf "%s\n" "${APPLE_API_PRIVATE_KEY}" > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
              )
              export API_PRIVATE_KEYS_DIR="$RUNNER_TEMP/private_keys"
              IPA_ABS_PATH="$(pwd)/${IPA_PATH}"

              TRANSPORTER_BIN=""
              if [ -x "/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter" ]; then
                TRANSPORTER_BIN="/Applications/Transporter.app/Contents/itms/bin/iTMSTransporter"
              elif [ -x "/usr/local/itms/bin/iTMSTransporter" ]; then
                TRANSPORTER_BIN="/usr/local/itms/bin/iTMSTransporter"
              fi

              if [ -n "${TRANSPORTER_BIN}" ]; then
                (
                  cd "$RUNNER_TEMP"
                  "${TRANSPORTER_BIN}" -m upload \
                    -assetFile "${IPA_ABS_PATH}" \
                    -apiKey "${APPLE_API_KEY_ID}" \
                    -apiIssuer "${APPLE_API_ISSUER_ID}"
                )
              else
                RESOLVED_APP_ID="${APPLE_APP_ID}"
                ALTOOL_ERR="$RUNNER_TEMP/altool-list-apps.err"
                APPS_JSON=""
                if [ -z "${RESOLVED_APP_ID}" ]; then
                  rm -f "${ALTOOL_ERR}"
                  APPS_JSON=$(cd "$RUNNER_TEMP" && xcrun altool --list-apps \
                    --apiKey "${APPLE_API_KEY_ID}" \
                    --apiIssuer "${APPLE_API_ISSUER_ID}" \
                    --output-format json 2>"${ALTOOL_ERR}" || true)
                  if [ -n "${APPS_JSON}" ]; then
                    RESOLVED_APP_ID=$(APPS_JSON="${APPS_JSON}" python3 -c '
          import json, os, re
          target = "com.vectorchess.game"
          BUNDLE_KEYS = {"bundleid", "bundleidentifier", "cfbundleidentifier"}
          APP_ID_KEYS = {"id", "appleid", "adamid", "itemid", "appadamid"}
          def norm(key):
              return re.sub(r"[^a-z0-9]", "", str(key).lower())
          def is_num_id(val):
              return isinstance(val, (int, str)) and not isinstance(val, bool) and str(val).isdigit()
          def pick(mapping, allowed, pred=None):
              if not isinstance(mapping, dict):
                  return None
              for mk, mv in mapping.items():
                  if norm(mk) in allowed and mv is not None and mv != "":
                      if pred is None or pred(mv):
                          return mv
              return None
          def search(node):
              if isinstance(node, dict):
                  attrs = node.get("attributes") if isinstance(node.get("attributes"), dict) else None
                  bid = pick(node, BUNDLE_KEYS) or pick(attrs, BUNDLE_KEYS)
                  aid = pick(node, APP_ID_KEYS, is_num_id) or pick(attrs, APP_ID_KEYS, is_num_id)
                  if bid == target and is_num_id(aid):
                      return str(aid)
                  for k, v in node.items():
                      if k == target:
                          if is_num_id(v):
                              return str(v)
                          nested_aid = pick(v, APP_ID_KEYS, is_num_id)
                          if is_num_id(nested_aid):
                              return str(nested_aid)
                      if v == target and is_num_id(k):
                          return str(k)
                      res = search(v)
                      if res:
                          return res
              elif isinstance(node, list):
                  for item in node:
                      res = search(item)
                      if res:
                          return res
              return ""
          try:
              print(search(json.loads(os.environ["APPS_JSON"])))
          except Exception:
              print("")
          ')
                  fi
                fi
                if [[ ! "${RESOLVED_APP_ID}" =~ ^[0-9]+$ ]]; then
                  if [ -n "${APPS_JSON}" ]; then
                    APPS_JSON="${APPS_JSON}" python3 -c '
          import json, os
          try:
              errs = json.loads(os.environ["APPS_JSON"]).get("product-errors") or []
              for err in errs:
                  msg = err.get("message") if isinstance(err, dict) else None
                  if msg:
                      clean = str(msg).replace("\r", " ").replace("\n", " ")
                      print("::warning::altool --list-apps error:", clean)
          except Exception:
              pass
          ' || true
                  fi
                  if [ -s "${ALTOOL_ERR}" ]; then
                    cat "${ALTOOL_ERR}" >&2
                  fi
                  echo "::error::Transporter.app is not installed on this runner and numeric APPLE_APP_ID could not be resolved for com.vectorchess.game. Configure the APPLE_APP_ID variable/secret (numeric Apple ID from App Store Connect -> App Information) or install Transporter.app."
                  exit 1
                fi
                rm -f "${ALTOOL_ERR}"
                (
                  cd "$RUNNER_TEMP"
                  xcrun altool --upload-package "${IPA_ABS_PATH}" \
                    -t ios \
                    --apple-id "${RESOLVED_APP_ID}" \
                    --bundle-id "com.vectorchess.game" \
                    --bundle-short-version-string "${SHORT_VERSION}" \
                    --bundle-version "${BUILD_VERSION}" \
                    --apiKey "${APPLE_API_KEY_ID}" \
                    --apiIssuer "${APPLE_API_ISSUER_ID}"
                )
              fi
              rm -rf "$RUNNER_TEMP/private_keys"
              echo '- iOS `.ipa`: Uploaded to **App Store Connect / TestFlight**.' >> "$GITHUB_STEP_SUMMARY"
            fi

            security delete-keychain "${KEYCHAIN_PATH}" 2>/dev/null || true
          else
            python3 -c '
          import pathlib
          p = pathlib.Path("export_presets.cfg")
          s = p.read_text(encoding="utf-8")
          for old, new in (
              ("application/app_store_team_id=\"\"", "application/app_store_team_id=\"0000000000\""),
              ("application/export_project_only=false", "application/export_project_only=true"),
          ):
              if old not in s:
                  raise SystemExit(f"Failed to find {old} in export_presets.cfg")
              s = s.replace(old, new)
          p.write_text(s, encoding="utf-8")
          '
            "${GODOT_BIN}" --headless --export-release "iOS" "build/ios/${EXPORT_NAME}.ipa"
            ditto -c -k --keepParent "build/ios" "dist/${EXPORT_NAME}-iOS-XcodeProject-v${VERSION}.zip"
            echo "::warning::Apple iOS signing secrets not configured; exported unsigned Xcode project archive instead of .ipa."
            echo '- iOS: **Xcode Project** exported (configure `APPLE_TEAM_ID`, `APPLE_IOS_CERTIFICATE_BASE64`, and `APPLE_IOS_PROVISIONING_PROFILE_BASE64` to output signed `.ipa`).' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Steam macOS Depot Artifact
        uses: actions/upload-artifact@v4
        with:
          name: steam-macos
          path: build/steam-macos.tar
          if-no-files-found: error

      - name: Upload Apple Release Packages
        uses: actions/upload-artifact@v4
        with:
          name: release-packages-apple
          path: dist/
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # 4. Upload Windows, Linux, and macOS Depots to SteamPipe (when configured)
  # ---------------------------------------------------------------------------
  deploy-steam:
    name: Deploy to SteamPipe
    needs: [test, build-desktop-android, build-apple]
    if: inputs.upload_to_stores == true && vars.STEAM_APP_ID != ''
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download Windows Depot
        uses: actions/download-artifact@v4
        with:
          name: steam-windows
          path: build/windows

      - name: Download Linux Depot
        uses: actions/download-artifact@v4
        with:
          name: steam-linux
          path: ${{ runner.temp }}/steam-linux

      - name: Download macOS Depot
        uses: actions/download-artifact@v4
        with:
          name: steam-macos
          path: ${{ runner.temp }}/steam-macos

      - name: Unpack Depots & Populate SteamPipe VDFs
        env:
          STEAM_APP_ID: ${{ vars.STEAM_APP_ID }}
          DEPOT_WIN: ${{ vars.STEAM_DEPOT_WINDOWS }}
          DEPOT_LIN: ${{ vars.STEAM_DEPOT_LINUX }}
          DEPOT_MAC: ${{ vars.STEAM_DEPOT_MACOS }}
          SET_LIVE: ${{ needs.test.outputs.steam_branch }}
          VERSION: ${{ needs.test.outputs.version }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          TRIMMED_LIVE="${SET_LIVE#"${SET_LIVE%%[![:space:]]*}"}"
          TRIMMED_LIVE="${TRIMMED_LIVE%"${TRIMMED_LIVE##*[![:space:]]}"}"
          if [[ "${TRIMMED_LIVE,,}" == "default" ]]; then
            echo "::error::SteamPipe/SteamCMD forbids setting the 'default' branch live via SetLive. Promote builds to 'default' manually in the Steamworks Partner web portal."
            exit 1
          fi

          mkdir -p build steam/output
          tar -xf "$RUNNER_TEMP/steam-linux/steam-linux.tar" -C build
          tar -xf "$RUNNER_TEMP/steam-macos/steam-macos.tar" -C build

          for VAR_NAME in STEAM_APP_ID DEPOT_WIN DEPOT_LIN DEPOT_MAC; do
            VAL="${!VAR_NAME}"
            if [[ ! "${VAL}" =~ ^[0-9]+$ ]]; then
              echo "::error::Required Steam variable ${VAR_NAME} must be a non-empty numeric ID (got '${VAL}')."
              exit 1
            fi
          done

          DESC="Vector Chess v${VERSION} (${COMMIT_SHA::7})"
          python3 - "${STEAM_APP_ID}" "${DEPOT_WIN}" "${DEPOT_LIN}" "${DEPOT_MAC}" "${DESC}" "${SET_LIVE}" <<'PY'
          import pathlib, sys

          app_id, depot_win, depot_lin, depot_mac, desc, set_live = sys.argv[1:7]

          def vdf_escape(val: str) -> str:
              return val.replace("\\", "\\\\").replace('"', '\\"')

          common_replacements = {
              "__STEAM_APP_ID__": vdf_escape(app_id),
              "__STEAM_DEPOT_WINDOWS__": vdf_escape(depot_win),
              "__STEAM_DEPOT_LINUX__": vdf_escape(depot_lin),
              "__STEAM_DEPOT_MACOS__": vdf_escape(depot_mac),
          }

          for vdf_path in sorted(pathlib.Path("steam").glob("*.vdf")):
              content = vdf_path.read_text(encoding="utf-8")
              for token, value in common_replacements.items():
                  content = content.replace(token, value)
              if vdf_path.name == "app_build.vdf":
                  content = content.replace("__BUILD_DESCRIPTION__", vdf_escape(desc))
                  content = content.replace("__SET_LIVE_BRANCH__", vdf_escape(set_live))
              vdf_path.write_text(content, encoding="utf-8")
          PY

      - name: Upload Build via Valve SteamCMD
        env:
          STEAM_USERNAME: ${{ secrets.STEAM_USERNAME }}
          STEAM_CONFIG_VDF: ${{ secrets.STEAM_CONFIG_VDF }}
        run: |
          if [ -z "${STEAM_USERNAME}" ] || [ -z "${STEAM_CONFIG_VDF}" ]; then
            echo "::warning::STEAM_USERNAME or STEAM_CONFIG_VDF secret not set; skipping SteamPipe upload."
            exit 0
          fi
          if [[ ! "${STEAM_USERNAME}" =~ ^[A-Za-z0-9_.-]+$ ]]; then
            echo "::error::Invalid STEAM_USERNAME format."
            exit 1
          fi
          STEAM_DIR="$RUNNER_TEMP/steamcmd"
          trap 'rm -rf "${STEAM_DIR}" "$HOME/Steam" "$HOME/.local/share/Steam" "$HOME/.steam"' EXIT
          sudo dpkg --add-architecture i386
          sudo apt-get update -qq
          sudo apt-get install -y -qq lib32gcc-s1 >/dev/null
          mkdir -p "${STEAM_DIR}"
          curl -fsSL "https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz" | tar -xz -C "${STEAM_DIR}"
          (
            umask 077
            mkdir -p "${STEAM_DIR}/config" "$HOME/Steam/config" "$HOME/.local/share/Steam/config"
            printf '%s\n' "${STEAM_CONFIG_VDF}" | base64 --decode > "${STEAM_DIR}/config/config.vdf"
            cp "${STEAM_DIR}/config/config.vdf" "$HOME/Steam/config/config.vdf"
            cp "${STEAM_DIR}/config/config.vdf" "$HOME/.local/share/Steam/config/config.vdf"
          )
          "${STEAM_DIR}/steamcmd.sh" \
            +@ShutdownOnFailedCommand 1 \
            +@NoPromptForPassword 1 \
            +login "${STEAM_USERNAME}" \
            +run_app_build "${GITHUB_WORKSPACE}/steam/app_build.vdf" \
            +quit < /dev/null

  # ---------------------------------------------------------------------------
  # 5. Tag & Publish GitHub Release with all downloadable store packages
  # ---------------------------------------------------------------------------
  github-release:
    name: Publish GitHub Release
    needs: [test, build-desktop-android, build-apple]
    if: inputs.create_github_release == true
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download Desktop & Android Packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages-desktop-android
          path: release-assets

      - name: Download Apple Packages
        uses: actions/download-artifact@v4
        with:
          name: release-packages-apple
          path: release-assets

      - name: Create Tag & GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.test.outputs.tag_name }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          EXISTING_REF_JSON=$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG_NAME}" 2>/dev/null || true)
          if [ -n "${EXISTING_REF_JSON}" ]; then
            EXISTING_SHA=$(EXISTING_REF_JSON="${EXISTING_REF_JSON}" GH_REPO="${GITHUB_REPOSITORY}" python3 -c '
          import json, os, subprocess
          repo = os.environ["GH_REPO"]
          ref = json.loads(os.environ["EXISTING_REF_JSON"]).get("object") or {}
          sha, kind = ref.get("sha", ""), ref.get("type", "")
          if kind == "tag" and sha:
              tag_obj = subprocess.run(
                  ["gh", "api", f"repos/{repo}/git/tags/{sha}"],
                  capture_output=True, text=True, check=False
              )
              if tag_obj.returncode == 0:
                  sha = (json.loads(tag_obj.stdout).get("object") or {}).get("sha", sha)
          print(sha)
          ' 2>/dev/null || true)
            if [ -n "${EXISTING_SHA}" ] && [ "${EXISTING_SHA}" != "${TARGET_SHA}" ]; then
              echo "::warning::Tag ${TAG_NAME} already points to ${EXISTING_SHA::7}; publishing assets built from ${TARGET_SHA::7} without moving the existing git tag."
            fi
          fi
          if gh release view "${TAG_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            gh release upload "${TAG_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
          else
            PRERELEASE_ARGS=()
            if [[ "${TAG_NAME}" == *-* ]]; then
              PRERELEASE_ARGS=(--prerelease)
            fi
            gh release create "${TAG_NAME}" release-assets/* \
              --repo "${GITHUB_REPOSITORY}" \
              --target "${TARGET_SHA}" \
              --title "Vector Chess ${TAG_NAME}" \
              --generate-notes \
              ${PRERELEASE_ARGS[@]+"${PRERELEASE_ARGS[@]}"}
          fi
